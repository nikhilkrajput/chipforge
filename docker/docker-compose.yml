version: '3.8'

services:
  chipforge-cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    image: chipforge:latest
    volumes:
      - ./projects:/projects
    working_dir: /projects

  chipforge-gui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gui
    image: chipforge-gui:latest
    ports:
      - "3000:3000"
    environment:
      - CHIPFORGE_BACKEND=http://chipforge-api:8080

  chipforge-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: chipforge-api:latest
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://chipforge:chipforge@db:5432/chipforge

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=chipforge
      - POSTGRES_PASSWORD=chipforge
      - POSTGRES_DB=chipforge
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
