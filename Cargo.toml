[workspace]
resolver = "2"
members = [
    "core/synthesis",
    "core/place_and_route",
    "core/simulation",
    "core/formal",
    "core/bitstream",
    "core/ml_accelerator",
    "core/quantum",
    "core/security",
    "core/dft",
    "core/common",
    "riscv/cores",
    "riscv/soc_builder",
    "riscv/debug",
    "riscv/software_toolchain",
    "gui/backend",
    "cloud/api/server",
    "cloud/api/client",
    "cloud/workers/common",
    "cloud/storage",
    "ai/inference",
    "plugins/api",
    "cli",
    "examples/simulation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ChipForge Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikhilkrajput/chipforge"
homepage = "https://chipforge.org"
documentation = "https://docs.chipforge.org"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"

# Graph algorithms
petgraph = "0.6"

# Parsing
nom = "7.1"
pest = "2.7"
pest_derive = "2.7"

# Mathematics
num-traits = "0.2"
num-complex = "0.4"
ndarray = "0.15"

# Data structures
hashbrown = "0.14"
indexmap = "2.1"
dashmap = "5.5"
bitvec = "1.0"

# Rayon for parallelism
rayon = "1.8"

# Testing
proptest = "1.4"
criterion = "0.5"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
debug = true
